[build]
  publish = "."
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/peptides"
  to = "/.netlify/functions/peptides"
  status = 200
  force = true

[[redirects]]
  from = "/api/peptides/*"
  to = "/.netlify/functions/peptides/:splat"
  status = 200
  force = true
